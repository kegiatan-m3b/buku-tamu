<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu Digital - MTsN 3 Banyuwangi</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @keyframes toastEnter { 0% { transform: translateY(-100%) scale(0.9); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    .animate-toast { animation: toastEnter 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes modalEnter { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
    .animate-modal { animation: modalEnter 0.3s ease-out forwards; }
    
    /* Scrollbar minimalis untuk tabel */
    .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px;}
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const SCHOOL_LOGO = "https://lh3.googleusercontent.com/d/1d8oc7fFLvWhiCsny_ssG7-Mxet0_C20h";

    // ==========================================
    // PASTE URL API GOOGLE APPS SCRIPT DI BAWAH INI
    // ==========================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycby3RjkHaQbyM1rT4uNDB4ayiy8YI0Ga2z2FWKIIDfTi662j-O-swaU-zV_l7EUX66pB6g/exec";

    const fetchAPI = async (action, payload = null) => {
      try {
        if (payload) {
          const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action, payload }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
          return await res.json();
        } else {
          const res = await fetch(GAS_URL + "?action=" + action);
          return await res.json();
        }
      } catch (err) {
        console.error(err); throw new Error("Gagal terhubung ke database server");
      }
    };

    const formatNoWA = (value) => {
      if (!value) return ''; let val = value.replace(/\D/g, ''); if (val.startsWith('0')) { val = '62' + val.substring(1); } return val;
    };

    function App() {
      const [view, setView] = useState('public'); 
      const [user, setUser] = useState(null);
      const [toast, setToast] = useState(null);

      const showToast = (msg, type = 'success') => { setToast({ msg, type }); setTimeout(() => setToast(null), 5000); };

      return (
        <div className="min-h-screen flex flex-col relative">
          {toast && (
            <div className="fixed top-6 left-0 right-0 z-[9999] flex justify-center px-4 pointer-events-none">
              <div className="animate-toast pointer-events-auto flex items-center gap-4 p-4 rounded-3xl shadow-2xl border border-white/40 bg-white/85 backdrop-blur-xl min-w-[320px] max-w-md w-full ring-1 ring-slate-900/5">
                <div className={`flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center shadow-lg ${toast.type === 'success' ? 'bg-gradient-to-br from-emerald-400 to-emerald-600 shadow-emerald-500/40 text-white' : 'bg-gradient-to-br from-rose-400 to-rose-600 shadow-rose-500/40 text-white'}`}><i className={`fas ${toast.type === 'success' ? 'fa-check text-xl' : 'fa-exclamation text-xl'}`}></i></div>
                <div className="flex-1">
                  <h4 className={`text-[11px] font-extrabold uppercase tracking-widest mb-0.5 ${toast.type === 'success' ? 'text-emerald-600' : 'text-rose-600'}`}>{toast.type === 'success' ? 'Sistem Informasi' : 'Peringatan Sistem'}</h4>
                  <p className="text-slate-800 text-sm font-semibold leading-snug">{toast.msg}</p>
                </div>
                <button onClick={() => setToast(null)} className="flex-shrink-0 text-slate-400 hover:text-slate-800 w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-200/50 transition-colors"><i className="fas fa-times text-lg"></i></button>
              </div>
            </div>
          )}
          {view === 'public' && <PublicForm setView={setView} showToast={showToast} />}
          {view === 'login' && <LoginView setView={setView} setUser={setUser} showToast={showToast} />}
          {view === 'dashboard' && <AdminDashboard user={user} setView={setView} showToast={showToast} />}
        </div>
      );
    }

    // ==========================================
    // HALAMAN PUBLIK REGISTRASI
    // ==========================================
    function PublicForm({ setView, showToast }) {
      const [formData, setFormData] = useState({ nama: '', noHp: '', instansi: '', jk: 'L', alamat: '', bertemu: '', keperluan: '' });
      const [keperluanLainnya, setKeperluanLainnya] = useState('');
      const [listGtk, setListGtk] = useState([]);
      const [submitting, setSubmitting] = useState(false);
      
      const videoRef = useRef(null); const canvasRef = useRef(null);
      const [photoBase64, setPhotoBase64] = useState(null);
      const [cameraError, setCameraError] = useState(false);

      useEffect(() => { fetchAPI('getGTK').then(data => setListGtk(data)).catch(() => showToast("Gagal memuat data GTK", "error")); startCamera(); return () => stopCamera(); }, []);

      const startCamera = async () => {
        setCameraError(false);
        try { const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play(); } } catch (err) { setCameraError(true); }
      };
      const stopCamera = () => { if (videoRef.current && videoRef.current.srcObject) { videoRef.current.srcObject.getTracks().forEach(t => t.stop()); } };

      const capturePhoto = () => {
        const video = videoRef.current; const canvas = canvasRef.current;
        if (!video || !canvas || cameraError) return;
        canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d'); ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dateStr = new Date().toLocaleString('id-ID', { dateStyle: 'full', timeStyle: 'medium' });
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
        ctx.font = "bold 15px Arial"; ctx.fillStyle = "#ffffff"; ctx.textAlign = "right"; ctx.fillText(`MTsN 3 Banyuwangi | ${dateStr}`, canvas.width - 15, canvas.height - 15);
        setPhotoBase64(canvas.toDataURL('image/jpeg', 0.8)); stopCamera();
      };

      const resetPhoto = () => { setPhotoBase64(null); startCamera(); };
      const handleFileFallback = (e) => { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (ev) => { setPhotoBase64(ev.target.result); stopCamera(); }; reader.readAsDataURL(file); };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!photoBase64) return showToast("Mohon ambil foto / bukti kunjungan Anda!", "error");
        let finalKeperluan = formData.keperluan === "Lainnya" ? keperluanLainnya : formData.keperluan;
        if (!finalKeperluan) return showToast("Silakan isi keperluan Anda", "error");

        setSubmitting(true);
        fetchAPI('saveGuest', { ...formData, keperluan: finalKeperluan, fotoBase64: photoBase64 }).then(res => {
          setSubmitting(false);
          if (res.success) {
            showToast(res.message, 'success');
            setFormData({ nama: '', noHp: '', instansi: '', jk: 'L', alamat: '', bertemu: '', keperluan: '' }); setKeperluanLainnya(''); setPhotoBase64(null); startCamera(); 
          } else showToast(res.message, 'error');
        }).catch(err => { setSubmitting(false); showToast("Sistem gagal terhubung", "error"); });
      };

      return (
        <div className="min-h-screen bg-slate-200 py-8 px-4 flex flex-col items-center">
          <div className="max-w-2xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">
            <div className="bg-emerald-700 px-6 py-8 text-white text-center relative">
              <button onClick={() => setView('login')} className="absolute top-4 right-4 bg-emerald-800 hover:bg-emerald-900 text-xs px-3 py-1.5 rounded-full font-medium transition"><i className="fas fa-lock mr-1"></i> Login</button>
              <img src={SCHOOL_LOGO} alt="Logo" className="w-16 h-16 bg-white rounded-full mx-auto p-1.5 mb-3 shadow" />
              <h1 className="text-xl font-bold tracking-tight">Buku Tamu Digital - MTsN 3 Banyuwangi</h1>
              <p className="text-emerald-100 text-sm mt-1">Pelayanan Terpadu Satu Pintu</p>
            </div>
            
            <form onSubmit={handleSubmit} className="p-6 space-y-5">
              <div className="mb-6 border-b border-slate-100 pb-2"><h2 className="text-white bg-blue-900 inline-block px-4 py-2 font-bold rounded-lg text-lg uppercase tracking-wide shadow-md"><i className="fas fa-user-edit mr-2"></i> Registrasi Tamu</h2></div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div><label className="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label><input type="text" required value={formData.nama} onChange={e=>setFormData({...formData, nama: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Masukkan nama..." /></div>
                <div><label className="block text-xs font-semibold text-slate-600 mb-1">No. Telepon/WA</label><input type="tel" required value={formData.noHp} onChange={e=>setFormData({...formData, noHp: formatNoWA(e.target.value)})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500" placeholder="628xxxxxxx (Otomatis)" /></div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div><label className="block text-xs font-semibold text-slate-600 mb-1">Asal Instansi</label><input type="text" required value={formData.instansi} onChange={e=>setFormData({...formData, instansi: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Wali Murid / Dinas / Umum" /></div>
                <div><label className="block text-xs font-semibold text-slate-600 mb-1">Jenis Kelamin</label><select value={formData.jk} onChange={e=>setFormData({...formData, jk: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500"><option value="L">Laki-laki (L)</option><option value="P">Perempuan (P)</option></select></div>
              </div>

              <div><label className="block text-xs font-semibold text-slate-600 mb-1">Alamat Lengkap</label><textarea required rows="2" value={formData.alamat} onChange={e=>setFormData({...formData, alamat: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none resize-none focus:ring-2 focus:ring-emerald-500" placeholder="Alamat lengkap anda..."></textarea></div>
              
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Bertemu Dengan</label>
                <select required value={formData.bertemu} onChange={e=>setFormData({...formData, bertemu: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                  <option value="" disabled>-- Pilih GTK / Pegawai --</option>
                  {listGtk.map((g, i) => <option key={i} value={g.nama}>{g.nama}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Keperluan</label>
                <select required value={formData.keperluan} onChange={e=>setFormData({...formData, keperluan: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500 mb-2">
                  <option value="" disabled>-- Pilih Keperluan --</option>
                  <option value="Kunjungan Dinas">Kunjungan Dinas</option>
                  <option value="Konsultasi Akademik/Siswa">Konsultasi Akademik / Siswa</option>
                  <option value="Pengurusan Dokumen/Ijazah">Pengurusan Dokumen / Ijazah</option>
                  <option value="Lainnya">Lainnya (Input Manual)</option>
                </select>
                {formData.keperluan === "Lainnya" && <input type="text" required value={keperluanLainnya} onChange={e=>setKeperluanLainnya(e.target.value)} className="w-full px-4 py-2.5 bg-white border border-emerald-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Tuliskan keperluan spesifik..." />}
              </div>
              
              <div className="border border-slate-200 rounded-xl p-4 bg-slate-50 text-center">
                <label className="block text-sm font-semibold text-slate-700 mb-3"><i className="fas fa-camera mr-2"></i>Ambil Foto Bukti</label>
                <div className="relative mx-auto w-full max-w-sm rounded-xl overflow-hidden mb-3 border-2 border-slate-800 bg-black shadow-inner">
                  <video ref={videoRef} autoPlay playsInline muted className={`w-full h-auto object-cover ${photoBase64 || cameraError ? 'hidden' : 'block'}`}></video>
                  {cameraError && !photoBase64 && (<div className="bg-slate-800 text-white p-6 rounded-lg text-xs"><i className="fas fa-exclamation-triangle text-3xl text-yellow-400 mb-3"></i><br/>Kamera diblokir. Silakan gunakan tombol unggah.</div>)}
                  <canvas ref={canvasRef} className="hidden"></canvas>
                  {photoBase64 && <img src={photoBase64} className="w-full h-auto object-cover" />}
                </div>

                {!photoBase64 ? (
                  <div className="flex flex-col gap-2 max-w-sm mx-auto">
                    {!cameraError && (<button type="button" onClick={capturePhoto} className="bg-emerald-600 text-white px-5 py-3 rounded-xl text-sm font-bold shadow-lg hover:bg-emerald-700 transition"><i className="fas fa-camera-retro mr-2"></i> Jepret Foto Sekarang</button>)}
                    <label className="bg-slate-600 text-white px-5 py-3 rounded-xl text-xs font-bold hover:bg-slate-700 transition cursor-pointer shadow mt-2"><i className="fas fa-folder-open mr-2"></i> Ambil Manual / Unggah File <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleFileFallback} /></label>
                  </div>
                ) : (
                  <button type="button" onClick={resetPhoto} className="bg-rose-500 text-white px-5 py-2.5 rounded-xl text-sm font-bold w-full max-w-sm shadow hover:bg-rose-600 transition"><i className="fas fa-redo mr-2"></i> Hapus & Ulangi Foto</button>
                )}
              </div>

              <button type="submit" disabled={submitting} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl transition flex justify-center items-center gap-2 text-sm disabled:opacity-50 shadow-xl mt-4">
                {submitting ? <i className="fas fa-spinner fa-spin text-xl"></i> : <i className="fas fa-paper-plane text-xl"></i>} {submitting ? 'Memproses Data...' : 'Kirim Registrasi'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // HALAMAN LOGIN (FITUR MATA PASSWORD)
    // ==========================================
    function LoginView({ setView, setUser, showToast }) {
      const [username, setUsername] = useState('Admin');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [loading, setLoading] = useState(false);

      const handleLogin = (e) => {
        e.preventDefault(); setLoading(true);
        fetchAPI('login', {username, password}).then(res => {
          setLoading(false);
          if (res.success) { setUser(res); showToast("Login berhasil diverifikasi!", 'success'); setView('dashboard'); } 
          else showToast(res.message, 'error');
        }).catch(() => { setLoading(false); showToast("Gagal terhubung server", "error"); });
      };

      return (
        <div className="min-h-screen bg-slate-900 flex items-center justify-center px-4">
          <div className="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 relative shadow-2xl">
            <button onClick={() => setView('public')} className="absolute top-6 left-6 text-slate-400 hover:text-white"><i className="fas fa-arrow-left text-xl"></i></button>
            <div className="text-center mb-8"><h2 className="text-2xl font-extrabold text-white mt-4">Login Sistem</h2><p className="text-slate-400 text-xs mt-1">MTsN 3 Banyuwangi</p></div>
            <form onSubmit={handleLogin} className="space-y-5">
              <div>
                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Akses Login</label>
                <select value={username} onChange={e=>setUsername(e.target.value)} className="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none focus:border-emerald-500 font-medium">
                  <option>Admin</option><option>Petugas</option><option>Pimpinan</option>
                </select>
              </div>
              <div className="relative">
                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Password</label>
                <input type={showPassword ? "text" : "password"} required value={password} onChange={e=>setPassword(e.target.value)} placeholder="Masukkan password..." className="w-full pl-4 pr-12 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none focus:border-emerald-500 font-medium" />
                <button type="button" onClick={()=>setShowPassword(!showPassword)} className="absolute right-4 top-8 text-slate-400 hover:text-white transition mt-0.5">
                  <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                </button>
              </div>
              <button type="submit" disabled={loading} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg mt-2">{loading ? 'Memverifikasi...' : 'Masuk Dashboard'}</button>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // DASHBOARD & MENU-MENU
    // ==========================================
    function AdminDashboard({ user, setView, showToast }) {
      const [activeMenu, setActiveMenu] = useState('rekap'); 
      const [sidebarOpen, setSidebarOpen] = useState(true); 
      const [mobileSidebar, setMobileSidebar] = useState(false);

      return (
        <div className="min-h-screen bg-slate-100 flex overflow-hidden">
          {/* Mobile Overlay */}
          <div onClick={()=>setMobileSidebar(false)} className={`fixed inset-0 bg-black/50 z-30 md:hidden ${mobileSidebar ? 'block' : 'hidden'}`}></div>
          
          {/* Sidebar */}
          <aside className={`${mobileSidebar ? 'translate-x-0' : '-translate-x-full'} ${sidebarOpen ? 'md:w-64 md:translate-x-0' : 'md:w-0 md:-translate-x-full'} fixed md:relative z-40 bg-slate-900 text-slate-300 flex flex-col transition-all duration-300 ease-in-out shadow-2xl h-screen shrink-0 overflow-hidden`}>
            <div className="p-6 border-b border-slate-800 flex items-center gap-3 w-64">
              <div className="w-10 h-10 bg-white rounded-xl p-1 shrink-0"><img src={SCHOOL_LOGO} className="w-full h-full object-contain" /></div>
              <div><h2 className="font-bold text-white text-sm tracking-wide">MTsN 3 BWI</h2><span className="text-[10px] text-emerald-400 uppercase font-extrabold tracking-widest">{user.role} PANEL</span></div>
            </div>
            <nav className="flex-1 p-4 space-y-2 w-64 overflow-y-auto">
              <button onClick={() => {setActiveMenu('rekap'); setMobileSidebar(false)}} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold text-sm transition ${activeMenu === 'rekap' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/50' : 'hover:bg-slate-800'}`}><i className="fas fa-list w-5"></i> Rekap Tamu</button>
              {user.role === 'admin' && (
                <>
                  <button onClick={() => {setActiveMenu('gtk'); setMobileSidebar(false)}} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold text-sm transition ${activeMenu === 'gtk' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/50' : 'hover:bg-slate-800'}`}><i className="fas fa-users w-5"></i> Data GTK</button>
                  <button onClick={() => {setActiveMenu('pengaturan'); setMobileSidebar(false)}} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold text-sm transition ${activeMenu === 'pengaturan' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/50' : 'hover:bg-slate-800'}`}><i className="fas fa-cog w-5"></i> Pengaturan</button>
                </>
              )}
            </nav>
            <div className="p-4 border-t border-slate-800 w-64">
              <button onClick={() => setView('public')} className="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold text-sm bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white transition"><i className="fas fa-sign-out-alt w-5"></i> Keluar</button>
            </div>
          </aside>

          {/* Konten Kanan */}
          <main className="flex-1 flex flex-col h-screen overflow-hidden min-w-0 relative">
            <header className="bg-white border-b border-slate-200 h-16 px-6 flex items-center gap-4 shrink-0 shadow-sm z-10">
              
              {/* TOMBOL HIDE/UNHIDE MENONJOL (KIRI KANAN) */}
              <button 
                onClick={() => setSidebarOpen(!sidebarOpen)} 
                className="hidden md:flex relative group items-center justify-center w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 hover:bg-emerald-600 hover:text-white shadow transition-all duration-300 border border-emerald-200 hover:border-emerald-600"
              >
                <i className={`fas ${sidebarOpen ? 'fa-arrow-left' : 'fa-arrow-right'} text-lg`}></i>
                {/* Teks Melayang (Tooltip) */}
                <span className="absolute top-12 whitespace-nowrap bg-slate-800 text-white text-[10px] font-bold px-2.5 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none shadow-lg z-50">
                  {sidebarOpen ? 'Hide Menu (Sembunyikan)' : 'Unhide Menu (Tampilkan)'}
                </span>
              </button>

              <button onClick={() => setMobileSidebar(true)} className="md:hidden text-slate-600 text-lg"><i className="fas fa-bars"></i></button>
              
              <h1 className="font-extrabold text-slate-800 uppercase tracking-wide text-sm md:text-base ml-2">{activeMenu} SISTEM</h1>
            </header>
            <div className="p-4 md:p-6 flex-1 overflow-y-auto bg-slate-50">
              {activeMenu === 'rekap' && <RekapTamuView showToast={showToast} user={user} />}
              {activeMenu === 'gtk' && user.role === 'admin' && <DataGTKView showToast={showToast} />}
              {activeMenu === 'pengaturan' && user.role === 'admin' && <PengaturanView showToast={showToast} />}
            </div>
          </main>
        </div>
      );
    }

    // --- VIEW: REKAP TAMU DENGAN FIX GAMBAR ---
    function RekapTamuView({ showToast, user }) {
      const [guests, setGuests] = useState([]);
      const [filteredData, setFilteredData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filterMulai, setFilterMulai] = useState('');
      const [filterAkhir, setFilterAkhir] = useState('');
      const [previewImgUrl, setPreviewImgUrl] = useState(null);
      
      const [editModalOpen, setEditModalOpen] = useState(false);
      const [editForm, setEditForm] = useState(null);
      const [savingEdit, setSavingEdit] = useState(false);

      useEffect(() => { loadData(); }, []);

      const loadData = () => {
        setLoading(true);
        fetchAPI('getGuest').then(data => { setGuests(data); setFilteredData(data); setLoading(false); }).catch(() => showToast("Gagal memuat rekap tamu", "error"));
      };

      const handleFilter = () => {
        if (!filterMulai && !filterAkhir) return setFilteredData(guests);
        const filtered = guests.filter(g => {
          if(!g.tanggal) return false;
          let matchMulai = true; let matchAkhir = true;
          const dateOnly = g.tanggal.split(' ')[0];
          if(filterMulai) matchMulai = dateOnly >= filterMulai;
          if(filterAkhir) matchAkhir = dateOnly <= filterAkhir;
          return matchMulai && matchAkhir;
        });
        setFilteredData(filtered);
      };

      const downloadPDF = () => {
        if (filteredData.length === 0) return showToast("Data kosong", "error");
        const { jsPDF } = window.jspdf; const doc = new jsPDF('landscape'); 
        doc.setFontSize(16); doc.text("Rekapitulasi Buku Tamu - MTsN 3 Banyuwangi", 14, 15);
        doc.setFontSize(10); doc.text(`Periode: ${filterMulai || 'Awal'} s.d ${filterAkhir || 'Akhir'}`, 14, 22);
        
        const tableColumn = ["Tgl/Waktu", "Nama", "L/P", "No. HP", "Instansi", "Alamat", "Bertemu", "Keperluan"];
        const tableRows = [];
        filteredData.forEach(g => { tableRows.push([g.tanggal, g.nama, g.jk, g.noHp, g.instansi, g.alamat, g.bertemu, g.keperluan]); });
        
        doc.autoTable({ head: [tableColumn], body: tableRows, startY: 28, theme: 'grid', styles: { fontSize: 7 } });
        doc.save(`Rekap_Tamu_${new Date().getTime()}.pdf`);
        showToast("PDF berhasil diunduh!", "success");
      };

      const openEditModal = (guest) => { setEditForm({...guest}); setEditModalOpen(true); };
      const handleSaveEdit = (e) => {
        e.preventDefault(); setSavingEdit(true);
        fetchAPI('editGuest', editForm).then(res => {
          setSavingEdit(false);
          if(res.success) { showToast(res.message, 'success'); setEditModalOpen(false); loadData(); }
          else { showToast(res.message, 'error'); }
        });
      };
      const handleDelete = (id) => {
        if(confirm("PERINGATAN: Anda yakin ingin menghapus data tamu ini secara permanen?")) {
          setLoading(true);
          fetchAPI('deleteGuest', id).then(res => {
            if(res.success) { showToast(res.message, 'success'); loadData(); }
            else { showToast(res.message, 'error'); setLoading(false); }
          });
        }
      };

      const StatusBadge = ({ status }) => {
        let badgeClass = "bg-slate-100 text-slate-500"; let text = status;
        if (status === 'Terkirim') badgeClass = "bg-emerald-100 text-emerald-700";
        else if (status.startsWith('Gagal')) { badgeClass = "bg-rose-100 text-rose-700 cursor-help"; text = "GAGAL"; }
        return (<span title={status} className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${badgeClass}`}>{text}</span>);
      };

      return (
        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 relative">
          
          {/* ==========================================
              FIX MODAL GAMBAR DENGAN API THUMBNAIL GOOGLE
              ========================================== */}
          {previewImgUrl && (
            <div className="fixed inset-0 z-[99999] bg-slate-900/90 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setPreviewImgUrl(null)}>
              <div className="animate-modal relative w-full max-w-4xl bg-white p-2 md:p-3 rounded-2xl shadow-2xl" onClick={e => e.stopPropagation()}>
                <button onClick={() => setPreviewImgUrl(null)} className="absolute -top-12 right-0 text-white hover:text-rose-400 text-3xl bg-slate-800/50 px-3 py-1 rounded-full transition"><i className="fas fa-times"></i></button>
                <img 
                  src={(() => {
                    let fileId = "";
                    const m1 = previewImgUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                    const m2 = previewImgUrl.match(/id=([a-zA-Z0-9_-]+)/);
                    if(m1) fileId = m1[1]; else if(m2) fileId = m2[1];
                    // Langsung panggil API Thumbnail Resmi yang 100% stabil
                    return fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000` : previewImgUrl;
                  })()}
                  onError={(e) => {
                    // Jika API Thumbnail gagal, coba panggil viewer link aslinya
                    let fileId = "";
                    const m1 = previewImgUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                    const m2 = previewImgUrl.match(/id=([a-zA-Z0-9_-]+)/);
                    if(m1) fileId = m1[1]; else if(m2) fileId = m2[1];
                    if(fileId) {
                      const fallback = `https://drive.google.com/uc?export=view&id=${fileId}`;
                      if(e.target.src !== fallback) e.target.src = fallback;
                    }
                  }}
                  className="w-full h-auto max-h-[85vh] object-contain rounded-xl bg-slate-100 shadow-inner" 
                  alt="Bukti Foto Diperbesar"
                />
              </div>
            </div>
          )}

          {/* MODAL EDIT TAMU (KHUSUS ADMIN) */}
          {editModalOpen && editForm && user.role === 'admin' && (
            <div className="fixed inset-0 z-[99999] bg-slate-900/70 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="animate-modal w-full max-w-2xl bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="bg-emerald-600 px-6 py-4 flex justify-between items-center text-white shrink-0">
                  <h3 className="font-bold text-lg"><i className="fas fa-edit mr-2"></i>Edit Data Tamu</h3>
                  <button onClick={() => setEditModalOpen(false)} className="hover:text-emerald-200 text-xl"><i className="fas fa-times"></i></button>
                </div>
                <div className="p-6 overflow-y-auto custom-scrollbar">
                  <form id="editForm" onSubmit={handleSaveEdit} className="space-y-4">
                    <div className="grid grid-cols-2 gap-4">
                      <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Nama</label><input type="text" value={editForm.nama} onChange={e=>setEditForm({...editForm, nama: e.target.value})} className="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50" required /></div>
                      <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">No. HP</label><input type="text" value={editForm.noHp} onChange={e=>setEditForm({...editForm, noHp: formatNoWA(e.target.value)})} className="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50" required /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Asal Instansi</label><input type="text" value={editForm.instansi} onChange={e=>setEditForm({...editForm, instansi: e.target.value})} className="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50" required /></div>
                      <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">L/P</label><select value={editForm.jk} onChange={e=>setEditForm({...editForm, jk: e.target.value})} className="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50" required><option value="L">Laki-laki (L)</option><option value="P">Perempuan (P)</option></select></div>
                    </div>
                    <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Alamat Lengkap</label><textarea value={editForm.alamat} onChange={e=>setEditForm({...editForm, alamat: e.target.value})} className="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50" rows="2" required></textarea></div>
                    <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Bertemu Dengan</label><input type="text" value={editForm.bertemu} onChange={e=>setEditForm({...editForm, bertemu: e.target.value})} className="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50" required /></div>
                    <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Keperluan</label><textarea value={editForm.keperluan} onChange={e=>setEditForm({...editForm, keperluan: e.target.value})} className="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50" rows="2" required></textarea></div>
                  </form>
                </div>
                <div className="p-4 border-t bg-slate-50 flex justify-end gap-3 shrink-0">
                  <button onClick={() => setEditModalOpen(false)} type="button" className="px-5 py-2 rounded-lg text-sm font-bold bg-slate-200 text-slate-700 hover:bg-slate-300 transition">Batal</button>
                  <button type="submit" form="editForm" disabled={savingEdit} className="px-5 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition shadow-lg">{savingEdit ? 'Menyimpan...' : 'Simpan Perubahan'}</button>
                </div>
              </div>
            </div>
          )}

          <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-6">
            <div className="flex flex-wrap items-end gap-3 w-full lg:w-auto">
              <div><label className="block text-[10px] uppercase text-slate-500 font-extrabold mb-1">Mulai Tgl</label><input type="date" value={filterMulai} onChange={e=>setFilterMulai(e.target.value)} className="border rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500 font-medium" /></div>
              <div><label className="block text-[10px] uppercase text-slate-500 font-extrabold mb-1">Sampai Tgl</label><input type="date" value={filterAkhir} onChange={e=>setFilterAkhir(e.target.value)} className="border rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500 font-medium" /></div>
              <button onClick={handleFilter} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition shadow"><i className="fas fa-search mr-1"></i> Filter</button>
            </div>
            <div className="flex gap-2">
              <button onClick={loadData} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold transition"><i className="fas fa-sync-alt"></i></button>
              <button onClick={downloadPDF} className="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition shadow-lg"><i className="fas fa-file-pdf mr-2"></i> Ekspor PDF</button>
            </div>
          </div>
          {loading ? <div className="text-center py-10"><i className="fas fa-spinner fa-spin text-2xl text-emerald-600"></i><p className="mt-2 text-sm text-slate-500 font-medium">Memuat Data...</p></div> : 
            <div className="overflow-x-auto rounded-xl border border-slate-100 custom-scrollbar pb-2">
              <table className="w-full text-left border-collapse text-sm whitespace-nowrap min-w-[1000px]">
                <thead className="bg-slate-50"><tr className="border-b border-slate-200 text-slate-500 text-[10px] uppercase font-extrabold tracking-wider"><th className="py-3 px-3">Tgl</th><th className="py-3 px-3">Nama</th><th className="py-3 px-2">L/P</th><th className="py-3 px-3">No. HP</th><th className="py-3 px-3">Instansi</th><th className="py-3 px-3">Alamat</th><th className="py-3 px-3">Bertemu</th><th className="py-3 px-3">Keperluan</th><th className="py-3 px-3 text-center">Foto</th><th className="py-3 px-2 text-center" title="Pimpinan / Wakil / GTK">Status WA</th>{user.role === 'admin' && <th className="py-3 px-3 text-center sticky right-0 bg-slate-50 border-l border-slate-200">Aksi</th>}</tr></thead>
                <tbody>
                  {filteredData.map((g, i) => (
                    <tr key={i} className="border-b border-slate-50 hover:bg-slate-50/80 transition-colors">
                      <td className="py-2.5 px-3 text-xs font-medium text-slate-500">{g.tanggal}</td>
                      <td className="py-2.5 px-3 font-bold text-slate-800">{g.nama}</td>
                      <td className="py-2.5 px-2 text-slate-600">{g.jk}</td>
                      <td className="py-2.5 px-3 text-slate-600">{g.noHp}</td>
                      <td className="py-2.5 px-3 text-slate-600">{g.instansi}</td>
                      <td className="py-2.5 px-3 text-slate-600 max-w-[150px] truncate" title={g.alamat}>{g.alamat}</td>
                      <td className="py-2.5 px-3 font-semibold text-slate-700">{g.bertemu}</td>
                      <td className="py-2.5 px-3 text-slate-600 max-w-[150px] truncate" title={g.keperluan}>{g.keperluan}</td>
                      <td className="py-2.5 px-3 text-center">{g.buktiUrl !== '-' ? <button onClick={() => setPreviewImgUrl(g.buktiUrl)} className="text-blue-600 hover:text-blue-800 font-bold bg-blue-50 px-2 py-1 rounded-lg text-xs"><i className="fas fa-image"></i> Buka</button> : '-'}</td>
                      <td className="py-2.5 px-2 text-center flex flex-col gap-1 mt-1"><StatusBadge status={g.waPimpinan} /><StatusBadge status={g.waWakil} /><StatusBadge status={g.waGTK} /></td>
                      {user.role === 'admin' && (
                        <td className="py-2.5 px-3 text-center sticky right-0 bg-white border-l border-slate-100 shadow-[-5px_0_10px_-5px_rgba(0,0,0,0.05)]">
                          <button onClick={()=>openEditModal(g)} className="text-blue-600 hover:bg-blue-50 px-2 py-1.5 rounded mr-1" title="Edit"><i className="fas fa-edit"></i></button>
                          <button onClick={()=>handleDelete(g.id)} className="text-rose-600 hover:bg-rose-50 px-2 py-1.5 rounded" title="Hapus"><i className="fas fa-trash"></i></button>
                        </td>
                      )}
                    </tr>
                  ))}
                  {filteredData.length === 0 && <tr><td colSpan={user.role === 'admin' ? "11" : "10"} className="text-center py-8 text-slate-400 font-medium">Belum ada data tamu.</td></tr>}
                </tbody>
              </table>
            </div>
          }
        </div>
      );
    }

    // --- VIEW: MANAJEMEN GTK ---
    function DataGTKView({ showToast }) {
      const [list, setList] = useState([]); const [loading, setLoading] = useState(false); const [form, setForm] = useState({ id: '', nama: '', noWa: '' }); const [isEditing, setIsEditing] = useState(false);
      useEffect(() => { loadGTK(); }, []);
      const loadGTK = () => { setLoading(true); fetchAPI('getGTK').then(data => { setList(data); setLoading(false); }); };
      const handleSave = (e) => { e.preventDefault(); setLoading(true); fetchAPI('saveGTK', form).then(res => { showToast(res.message, res.success ? 'success' : 'error'); setForm({ id: '', nama: '', noWa: '' }); setIsEditing(false); loadGTK(); }); };
      const handleEdit = (gtk) => { setForm(gtk); setIsEditing(true); };
      const handleDelete = (id) => { if(!confirm("Anda yakin ingin menghapus data guru ini?")) return; setLoading(true); fetchAPI('deleteGTK', id).then(res => { showToast(res.message, res.success ? 'success' : 'error'); loadGTK(); }); };
      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div className="md:col-span-1 bg-white rounded-3xl shadow-sm border border-slate-200 p-6 h-fit">
            <h3 className="font-extrabold text-slate-800 mb-4">{isEditing ? 'Edit Data Pegawai' : 'Tambah Pegawai / GTK'}</h3>
            <form onSubmit={handleSave} className="space-y-4">
              <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Nama GTK</label><input type="text" required value={form.nama} onChange={e=>setForm({...form, nama: e.target.value})} className="w-full px-4 py-2.5 border rounded-xl text-sm font-medium outline-none focus:border-emerald-500 bg-slate-50" /></div>
              <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">No. WhatsApp</label><input type="text" required value={form.noWa} onChange={e=>setForm({...form, noWa: formatNoWA(e.target.value)})} className="w-full px-4 py-2.5 border rounded-xl text-sm font-medium outline-none focus:border-emerald-500 bg-slate-50" placeholder="628xxx" /></div>
              <div className="flex gap-2 pt-2"><button type="submit" disabled={loading} className="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-bold shadow-lg hover:bg-emerald-700 transition">{loading ? 'Menyimpan...' : 'Simpan Data'}</button>{isEditing && <button type="button" onClick={() => {setForm({id:'', nama:'', noWa:''}); setIsEditing(false);}} className="bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-bold hover:bg-slate-300">Batal</button>}</div>
            </form>
          </div>
          <div className="md:col-span-2 bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
            <h3 className="font-extrabold text-slate-800 mb-4">Daftar GTK & Pegawai</h3>
            <div className="overflow-x-auto rounded-xl border border-slate-100"><table className="w-full text-left text-sm border-collapse"><thead className="bg-slate-50"><tr className="border-b border-slate-200 text-slate-500 text-[11px] uppercase font-extrabold tracking-wider"><th className="py-3 px-4">Nama Lengkap</th><th className="py-3 px-4">No. WA</th><th className="py-3 px-4 text-center">Aksi</th></tr></thead><tbody>{list.map((g, i) => (<tr key={i} className="border-b hover:bg-slate-50/80 transition-colors"><td className="py-3 px-4 font-bold text-slate-700">{g.nama}</td><td className="py-3 px-4 font-medium text-slate-600">{g.noWa}</td><td className="py-3 px-4 text-center"><button onClick={()=>handleEdit(g)} className="text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg text-xs font-bold mr-2 transition"><i className="fas fa-edit"></i> Edit</button><button onClick={()=>handleDelete(g.id)} className="text-rose-600 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg text-xs font-bold transition"><i className="fas fa-trash"></i> Hapus</button></td></tr>))}{list.length === 0 && <tr><td colSpan="3" className="text-center py-6 text-slate-400 font-medium">Belum ada data guru/pegawai.</td></tr>}</tbody></table></div>
          </div>
        </div>
      );
    }

    // --- VIEW: PENGATURAN SISTEM ---
    function PengaturanView({ showToast }) {
      const [form, setForm] = useState({ tokenFonnte: '', waPimpinan: '', waWakil: '' }); const [loading, setLoading] = useState(false);
      useEffect(() => { fetchAPI('getSettings').then(data => setForm(data)); }, []);
      const handleSave = (e) => { e.preventDefault(); setLoading(true); fetchAPI('saveSettings', form).then(res => { setLoading(false); showToast(res.message, res.success ? 'success' : 'error'); }); };
      return (
        <div className="max-w-xl bg-white rounded-3xl shadow-sm border border-slate-200 p-8">
          <h3 className="font-extrabold text-slate-800 mb-6 flex items-center gap-3 text-lg"><i className="fas fa-shield-alt text-emerald-600 text-2xl"></i> Pengaturan Notifikasi WA</h3>
          <form onSubmit={handleSave} className="space-y-5">
            <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Token API Fonnte</label><input type="text" value={form.tokenFonnte} onChange={e=>setForm({...form, tokenFonnte: e.target.value})} className="w-full px-4 py-3 border rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50" placeholder="Masukkan Kode Token..." /></div>
            <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">No. WA Pimpinan / Kepala Sekolah</label><input type="tel" value={form.waPimpinan} onChange={e=>setForm({...form, waPimpinan: formatNoWA(e.target.value)})} className="w-full px-4 py-3 border rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50" placeholder="628xxxx (Otomatis)" /></div>
            <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">No. WA Wakil Pimpinan (Opsional)</label><input type="tel" value={form.waWakil} onChange={e=>setForm({...form, waWakil: formatNoWA(e.target.value)})} className="w-full px-4 py-3 border rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50" placeholder="628xxxx (Otomatis)" /></div>
            <div className="pt-2"><button type="submit" disabled={loading} className="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl transition hover:bg-emerald-700 shadow-lg">{loading ? 'Memproses Penyimpanan...' : 'Simpan Pengaturan Sistem'}</button></div>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
